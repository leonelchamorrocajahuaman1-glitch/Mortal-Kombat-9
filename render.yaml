# Blueprint de Render (https://render.com/docs/blueprint-spec).
# En Render: New → Blueprint → este repositorio → Apply. Plan gratuito, sin tarjeta.
#
# Variables opcionales: añádelas después en el panel (servicio → Environment), nunca aquí:
#   TURN_KEY_ID / TURN_KEY_API_TOKEN  TURN de Cloudflare para redes con NAT estricto (secretos)
#   ALLOWED_ORIGINS                   tu URL de Render, p. ej. https://mk9-lobby-companion.onrender.com
#   ICE_SERVERS                       JSON con otros servidores STUN/TURN
services:
  - type: web
    name: mk9-lobby-companion
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
